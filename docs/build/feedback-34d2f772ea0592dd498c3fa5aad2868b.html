<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Feedback</title>
  <script>
    // The MyST book theme toggles a `dark` class on the parent's <html>; this
    // page is framed same-origin, so mirror it and adopt the theme's design
    // tokens (colors + fonts) straight from the parent document. Standalone (or
    // cross-origin) it falls back to the OS preference and to the CSS defaults,
    // which hold the same values the site uses.
    (function () {
      var root = null;
      try {
        if (window.parent !== window) root = window.parent.document.documentElement;
      } catch (err) { /* cross-origin parent */ }

      var html = document.documentElement;
      var media = window.matchMedia('(prefers-color-scheme: dark)');

      function rgba(color, alpha) {
        var match = /^rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(color || '');
        return match ? 'rgba(' + match[1] + ',' + match[2] + ',' + match[3] + ',' + alpha + ')' : null;
      }

      function adoptParentStyles() {
        if (!root) return;
        try {
          var win = window.parent;
          var doc = win.document;
          var cs = win.getComputedStyle;
          var body = cs.call(win, doc.body);
          var heading = cs.call(win, doc.querySelector('article h1') || doc.querySelector('h1') || doc.body);
          var vars = {
            '--bg': body.backgroundColor,
            '--fg': heading.color,
            '--font-body': body.fontFamily,
            '--font-heading': heading.fontFamily,
            '--muted': rgba(heading.color, 0.62),
            '--border': rgba(heading.color, 0.16),
            '--card': rgba(heading.color, 0.05),
          };
          for (var name in vars) {
            // transparent backgrounds would break the page, keep the CSS default
            if (vars[name] && vars[name] !== 'rgba(0, 0, 0, 0)') {
              html.style.setProperty(name, vars[name]);
            }
          }
        } catch (err) { /* parent unreadable: keep CSS defaults */ }
      }

      function apply() {
        html.classList.toggle('dark', root ? root.classList.contains('dark') : media.matches);
        adoptParentStyles();
      }

      apply();
      document.addEventListener('DOMContentLoaded', adoptParentStyles);
      if (root) {
        new MutationObserver(apply).observe(root, { attributes: true, attributeFilter: ['class'] });
      } else {
        media.addEventListener('change', apply);
      }
    })();
  </script>
  <style>
    @font-face {
      font-family: "LUISS";
      font-style: normal;
      font-weight: normal;
      src: url("dist/fonts/LuissSans-Regular.otf") format("opentype"),
           url("/dist/fonts/LuissSans-Regular.otf") format("opentype");
    }

    @font-face {
      font-family: "LUISS";
      font-style: normal;
      font-weight: bold;
      src: url("dist/fonts/LuissSans-Bold.otf") format("opentype"),
           url("/dist/fonts/LuissSans-Bold.otf") format("opentype");
    }

    @font-face {
      font-family: "LUISS";
      font-style: italic;
      font-weight: normal;
      src: url("dist/fonts/LuissSans-italic.otf") format("opentype"),
           url("/dist/fonts/LuissSans-italic.otf") format("opentype");
    }

    @font-face {
      font-family: "LUISS";
      font-style: italic;
      font-weight: bold;
      src: url("dist/fonts/LuissSans-BoldItalic.otf") format("opentype"),
           url("/dist/fonts/LuissSans-BoldItalic.otf") format("opentype");
    }

    /* Defaults mirror the MyST book theme; when framed, the script above
       overwrites them with the parent's live computed values. */
    :root {
      color-scheme: light;
      --font-body: ui-sans-serif, system-ui, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
      --font-heading: "LUISS", "Lato", sans-serif;
      --fg: #1c1917;
      --muted: rgba(28, 25, 23, .62);
      --bg: #ffffff;
      --card: rgba(28, 25, 23, .05);
      --border: rgba(28, 25, 23, .16);
      --yes: #1a9c53;
      --no: #d1332e;
    }

    :root.dark {
      color-scheme: dark;
      --fg: #ffffff;
      --muted: rgba(255, 255, 255, .62);
      --bg: #1c1917;
      --card: rgba(255, 255, 255, .05);
      --border: rgba(255, 255, 255, .16);
      --yes: #2fbf71;
      --no: #ef5350;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      padding: 20px;
    }

    .tabs {
      display: flex;
      gap: 18px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .tabs a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
    }

    .tabs a.active {
      color: var(--fg);
      border-bottom: 2px solid var(--fg);
      padding-bottom: 8px;
      margin-bottom: -11px;
    }

    h1 {
      font-family: var(--font-heading);
      font-weight: 800;
      font-size: 1.75rem;
      margin: 0 0 8px;
    }

    .lead {
      color: var(--muted);
      margin: 0 0 18px;
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
    }

    .choice {
      flex: 1 1 140px;
      padding: 16px 28px;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .choice:disabled {
      opacity: .6;
      cursor: default;
    }

    .choice.yes {
      background: var(--yes);
    }

    .choice.no {
      background: var(--no);
    }

    .bar {
      display: flex;
      height: 34px;
      border-radius: 6px;
      overflow: hidden;
      background: var(--border);
    }

    #bar-yes {
      width: 0;
      background: var(--yes);
    }

    #bar-no {
      width: 0;
      background: var(--no);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      color: var(--muted);
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }

    .dot.yes {
      background: var(--yes);
    }

    .dot.no {
      background: var(--no);
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    input[type=password] {
      flex: 1 1 180px;
      padding: 12px;
      font-size: 1rem;
      color: var(--fg);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .primary {
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      /* inverse of the theme's text color, so it stays visible in both modes */
      color: var(--bg);
      background: var(--fg);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    .msg {
      color: var(--muted);
      min-height: 1.5em;
    }

    .msg.error {
      color: var(--no);
    }
  </style>
</head>

<body>
  <nav class="tabs" aria-label="Feedback sections">
    <a href="?" data-view="vote">Vote</a>
    <a href="?status" data-view="status">Results</a>
    <a href="?reset" data-view="reset">Reset</a>
  </nav>

  <main>
    <section id="view-vote" hidden>
      <h1>Vote!</h1>
      <p class="lead">Are you following the lecture?</p>
      <div id="vote-buttons" class="choices" hidden>
        <button type="button" class="choice yes" data-vote="positive">Yes</button>
        <button type="button" class="choice no" data-vote="negative">No</button>
      </div>
      <p id="vote-msg" class="msg" role="status"></p>
    </section>

    <section id="view-status" hidden>
      <h1>Results</h1>
      <p id="thanks" class="lead" hidden></p>
      <p class="lead">Votes: <strong id="voters">–</strong></p>
      <div class="bar" role="img" aria-label="Yes/No split">
        <div id="bar-yes"></div>
        <div id="bar-no"></div>
      </div>
      <p class="legend">
        <span><span class="dot yes"></span>Yes <strong id="pct-yes">–</strong></span>
        <span><span class="dot no"></span>No <strong id="pct-no">–</strong></span>
      </p>
      <p id="status-msg" class="msg" role="status"></p>
    </section>

    <section id="view-reset" hidden>
      <h1>Reset</h1>
      <form id="reset-form">
        <input id="reset-pw" type="password" placeholder="Password" autocomplete="current-password" required>
        <button type="submit" class="primary">Reset</button>
      </form>
      <p id="reset-msg" class="msg" role="status"></p>
    </section>
  </main>

  <script>
    'use strict';

    const params = new URLSearchParams(window.location.search);
    // ?api= is only a local-development convenience; the deployed page uses the
    // production endpoint.
    const API = (params.get('api') || 'https://feedback.nosec.it').replace(/\/+$/, '');
    const HEADERS = { 'X-Feedback-Client': 'web' };
    const EPOCH_KEY = 'feedbackEpoch';
    const PASSWORD_KEY = 'feedbackPassword';
    const POLL_MS = 5000;

    const $ = (id) => document.getElementById(id);

    async function api(path) {
      const response = await fetch(API + path, {
        headers: HEADERS,
        cache: 'no-store',
        credentials: 'omit',
      });
      const data = await response.json().catch(() => null);
      if (!response.ok) {
        throw new Error((data && data.error) || ('HTTP ' + response.status));
      }
      return data;
    }

    function message(id, text, isError) {
      const el = $(id);
      el.textContent = text || '';
      el.classList.toggle('error', Boolean(isError));
    }

    function show(name) {
      for (const view of ['vote', 'status', 'reset']) {
        $('view-' + view).hidden = view !== name;
      }
      for (const link of document.querySelectorAll('.tabs a')) {
        link.classList.toggle('active', link.dataset.view === name);
      }
    }

    // --- vote ---------------------------------------------------------------

    async function initVote() {
      show('vote');
      try {
        const epoch = await api('/epoch');
        if (localStorage.getItem(EPOCH_KEY) === epoch) {
          // Already voted in this poll: show the live tally instead of buttons.
          initStatus('Your vote has been recorded. Waiting for the lecturer to reset the poll.');
          return;
        }
        $('vote-buttons').hidden = false;
      } catch (err) {
        message('vote-msg', 'Server unreachable: ' + err.message, true);
      }
    }

    async function vote(kind) {
      const buttons = $('vote-buttons').querySelectorAll('button');
      buttons.forEach((b) => { b.disabled = true; });
      message('vote-msg', '');
      try {
        const epoch = await api('/epoch');
        await api('/feedback?t=' + kind);
        localStorage.setItem(EPOCH_KEY, epoch);
        initStatus('Thanks, your vote has been recorded.');
      } catch (err) {
        message('vote-msg', 'Vote not recorded: ' + err.message, true);
        buttons.forEach((b) => { b.disabled = false; });
      }
    }

    for (const button of $('vote-buttons').querySelectorAll('button')) {
      button.addEventListener('click', () => vote(button.dataset.vote));
    }

    // --- results ------------------------------------------------------------

    let statusTimer = null;

    function render(state) {
      const positive = state.positive || 0;
      const negative = state.negative || 0;
      const total = positive + negative;
      $('voters').textContent = String(total);
      const yes = total ? 100 * positive / total : 0;
      const no = total ? 100 * negative / total : 0;
      $('bar-yes').style.width = yes + '%';
      $('bar-no').style.width = no + '%';
      $('pct-yes').textContent = total ? yes.toFixed(1) + '%' : '–';
      $('pct-no').textContent = total ? no.toFixed(1) + '%' : '–';
    }

    async function refresh() {
      try {
        render(await api('/status'));
        message('status-msg', '');
      } catch (err) {
        message('status-msg', 'Server unreachable: ' + err.message, true);
      }
    }

    function initStatus(note) {
      show('status');
      $('thanks').textContent = note || '';
      $('thanks').hidden = !note;
      refresh();
      clearInterval(statusTimer);
      statusTimer = setInterval(refresh, POLL_MS);
    }

    // --- reset --------------------------------------------------------------

    function initReset() {
      show('reset');
      $('reset-pw').value = localStorage.getItem(PASSWORD_KEY) || '';
    }

    $('reset-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = $('reset-pw').value;
      message('reset-msg', 'Resetting...');
      try {
        const ok = await api('/reset?p=' + encodeURIComponent(password));
        if (ok) {
          localStorage.setItem(PASSWORD_KEY, password);
          window.location.search = '?status';
        } else {
          message('reset-msg', 'Invalid password.', true);
        }
      } catch (err) {
        message('reset-msg', 'Reset failed: ' + err.message, true);
      }
    });

    // --- routing ------------------------------------------------------------

    if (params.has('status')) {
      initStatus();
    } else if (params.has('reset')) {
      initReset();
    } else {
      initVote();
    }
  </script>
</body>

</html>
